name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: FloatTodo ${{ github.ref_name }}
          releaseBody: |
            ## 下载

            点击下方 `FloatTodo_x.x.x_x64-setup.exe` 安装，或下载 `.msi` 版本。

            **首次安装请使用安装包（.exe 或 .msi），安装后双击桌面图标即可启动。**

            ## 快捷键

            | 快捷键 | 功能 |
            |--------|------|
            | `Ctrl+Alt+T` | 显示 / 隐藏主窗口 |

          releaseDraft: false
          prerelease: false
